[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "meta-mcp"
version = "0.1.0"
description = "Internal MCP server exposing Meta Graph and Marketing API tools"
readme = "README.md"
authors = [{ name = "Meta MCP Team" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<0.28.0",
    "pydantic>=2.5.3,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "structlog>=23.2.0,<25.0.0",
    "fastapi>=0.104.0,<0.117.0",
    "uvicorn>=0.23.0,<0.38.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.12.0,<2.0.0",
    "aiosqlite>=0.19.0,<1.0.0",
    "greenlet>=3.0.0,<4.0.0",
    "cachetools>=5.3.0,<6.0.0",
    "python-dateutil>=2.8.0,<3.0.0",
    "typing-extensions>=4.8.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
    "coverage[toml]>=7.3",
    "pytest-cov>=4.1",
    "ruff>=0.1.7",
    "black>=23.12",
    "mypy>=1.7",
    "types-cachetools",
    "types-python-dateutil",
]

[project.scripts]
meta-mcp-server = "meta_mcp.server:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/meta_mcp", "src/mcp_meta_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "alembic", "docker", ".env.example"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "ASYNC", "A"]
ignore = [
    "E501",   # line-too-long (125 occurrences)
    "E402",   # module-import-not-at-top-of-file
    "F841",   # unused-variable (test mocks assigned for clarity)
]

[tool.ruff.lint.isort]
known-first-party = ["meta_mcp", "mcp_meta_sdk"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = false
warn_return_any = false
disallow_any_generics = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_reexport = false

[[tool.mypy.overrides]]
module = [
    "conftest",
    "test_auth_login",
    "test_client_internals",
    "test_client_internals_extended",
    "test_client_retries",
    "test_integration_auth_instagram",
    "test_integration_auth_manual",
    "test_sdk",
    "test_sdk_connect_simple",
    "test_sdk_errors",
    "test_sdk_extended",
    "test_server_integration",
    "test_token_service",
    "test_tools_ads",
    "test_tools_ads_errors",
    "test_tools_assets",
    "test_tools_assets_errors",
    "test_tools_common",
    "test_tools_core",
    "test_tools_insights",
    "test_tools_publish",
    "test_tools_research",
    "test_tools_research_errors",
    "test_tools_webhooks_extended",
    "test_webhooks",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --cov"
testpaths = ["tests"]

[tool.coverage.run]
source = ["meta_mcp", "mcp_meta_sdk"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60  # Pragmatic threshold focusing on critical paths
